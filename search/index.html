<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="shortcut icon" href="#">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | KEEPS.LOUDDER </title>
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../nav-style.css">
    <link rel="stylesheet" href="search.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <script src="https://kit.fontawesome.com/8efc22d7af.js" crossorigin="anonymous"></script>
</head>

<body>
    <!-- ================================= -->
    <!-- =========HIDDEN SEARCH=========== -->
    <!-- ================================= -->
    <div class="search-wrapper">
        <div class="search-input">
            <form id="search-form" class="search-input">
                <input type="text" name="search" id="search" placeholder="Type in product name, description, etc."
                    required autocomplete="off">
                <button type="submit" class="search-submit-btn">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>
        </div>
        <div class="trending-searches">
            <p class="trending-title">Trending searches:</p>
            <p class="trend">crossbody</p>
            <p class="trend">handbag</p>
            <p class="trend">tote bag</p>
            <p class="trend">piat bag</p>
        </div>
        <div class="search-row">
            <div class="search-row-img-wrapper">
                <img src="../img/front/handbags.webp" alt="" class="search-row-img">
                <p class="search-row-img-text">Handbags</p>
            </div>
            <div class="search-row-img-wrapper">
                <img src="../img/front/bucket.webp" alt="" class="search-row-img">
                <p class="search-row-img-text">Bucket Bags</p>
            </div>
            <div class="search-row-img-wrapper">
                <img src="../img/front/crossbody.webp" alt="" class="search-row-img">
                <p class="search-row-img-text">Crossbody Bags</p>
            </div>
            <div class="search-row-img-wrapper">
                <img src="../img/front/naga.webp" alt="" class="search-row-img">
                <p class="search-row-img-text">Naga Collection</p>
            </div>
            <div class="search-row-img-wrapper">
                <img src="../img/front/clutch.webp" alt="" class="search-row-img">
                <p class="search-row-img-text">Clutch Bag</p>
            </div>
            <div class="search-row-img-wrapper">
                <img src="../img/front/tote.webp" alt="" class="search-row-img">
                <p class="search-row-img-text">Tote Bag</p>
            </div>
        </div>
    </div>
    <!-- =========================== -->
    <!-- =========NAV BAR=========== -->
    <!-- =========================== -->
    <nav class="blurred-background">
        <div class="logo-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <div class="logo-container-left">
                <a href="/"> <img src="../img/logo.png" alt="KL Logo"></a>
            </div>
            <div class="logo-container-btns">
                <a class="cart-mobile" onclick="navigate('cart')"><i class="fa-solid fa-cart-shopping"></i><span
                        class="total-items-in-cart"></span></a>
                <div class="hamburger" id="hamburger">
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>
        </div>
        <div class="links-container">
            <span class="nav-link active" onclick="filterProducts('All Products', this)">All</span>
            <span class="nav-link" onclick="filterProducts('Handbags', this)">Handbags</span>
            <span class="nav-link" onclick="filterProducts('Crossbody', this)">Crossbody</span>
            <span class="nav-link" onclick="filterProducts('Home Decor', this)">Home Decor</span>
            <span class="nav-link" onclick="filterProducts('Accessories', this)">Accessories</span>
            <span class="nav-link" onclick="goToCancelOrderPage()">Cancel Order</span>
        </div>
    </nav>
    <!-- ===================================== -->
    <!-- =========PRODUCT CONTAINER=========== -->
    <!-- ===================================== -->
    <main class="container">
        <!-- PRODUCT FILTER -->
        <div id="product-filter">
            <p class="product-filter-title">Product Filter</p>
            <div id="controls">
                <input type="text" id="search-filter" placeholder="Search name, description, category..."
                    autocomplete="off">
                <select id="category-filter"></select>
                <select id="stock-filter">
                    <option value="all">All stock</option>
                    <option value="inStock">In stock</option>
                    <option value="outOfStock">Out of stock</option>
                </select>
                <select id="sort-by">
                    <option value="name-asc">Name (A-Z)</option>
                    <option value="price-asc">Price (Low to High)</option>
                    <option value="price-desc">Price (High to Low)</option>
                    <option value="recent">Recently Added</option>
                </select>
            </div>
        </div>
        <!-- SEARCH HEADER -->
        <section class="search-header">
            <h1>Search Results</h1>
            <p class="search-query-display">
                Showing results for: <span id="current-query-text">"..."</span>
            </p>
        </section>

        <!-- PRODUCT CONTAINER - WHERE ITEMS ARE RENDERED -->
        <section class="products-container" id="search-results-grid">
            <!-- Dynamic search result cards will render here -->
        </section>
        <div class="cart-modal item-added">
            <p class="card-modal-text">Item Added</p><i class="fa-solid fa-plus"></i>
        </div>
        <div class="cart-modal item-plus-one">
            <p class="card-modal-text">Item Qty</p><i class="fa-solid fa-plus"></i>
        </div>
    </main>
    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config.js"></script>
    <script src="../nav.js"></script>
    <script src="../navigation.js"></script>
    <script src="search.js"></script>
    <script src="../cartItem.js"></script>
</body>

</html>
