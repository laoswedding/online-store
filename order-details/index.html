<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="shortcut icon" href="#">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details | Keeps Loudder </title>
    <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../nav-style.css">
    <link rel="stylesheet" href="../order-details/order-details.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <script src="https://kit.fontawesome.com/8efc22d7af.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>

<body>
    <nav class="blurred-background">
        <div class="logo-container">
            <div class="logo-container-left">
                <a href="/"> <img src="../img/logo.png" alt="KL Logo"></a>
            </div>
        </div>
    </nav>
    <main>
        <div class="order-wrapper">
            <h1>Order Details</h1>
            <!-- ORDER DETAILS -->
            <div class="order-details" id="receipt">
            </div>
            <div class="order-bottom">
                <p class="note"><span class="note-text">Note: </span>After transfer slip has been verified and shipping
                    info is valid, you will be
                    notified of your tracking number.
                    Thank
                    you for your order!</p>
                <a href="#" class="download-receipt" id="download-receipt">Download Receipt</a>
                <p class="back-to-store-btn" onclick="clearUserObjectInStore()">Back To Store</p>
                <a href="https://keepsloudder.com/" class="website-link" onclick="clearUserObjectInStore()"><img
                        src="../img/favicon.png" alt="KL Logo">
                    Visit KEEPS.LOUDDER website</a>
            </div>
        </div>

    </main>
    <script src="../config.js"></script>
    <script src="order-details.js"></script>
</body>

</html>
