<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="shortcut icon" href="#">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Store | Keeps Loudder </title>
    <link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="nav-style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
    <script src="https://kit.fontawesome.com/8efc22d7af.js" crossorigin="anonymous"></script>
</head>

<body>
    <nav class="blurred-background">
        <div class="logo-container">
            <div class="logo-container-left">
                <a href="/"> <img src="img/logo.png" alt="KL Logo"></a>
            </div>
            <div class="logo-container-btns">
                <a class="cart-mobile" onClick="showCart()"><i class="fa-solid fa-cart-shopping"></i></a>
                <div class="hamburger" id="hamburger">
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>
        </div>
        <div class="links-container">
            <span class="nav-link active" onclick="filterProducts('All Products', this)">All</span>
            <span class="nav-link" onclick="filterProducts('Handbags', this)">Handbags</span>
            <span class="nav-link" onclick="filterProducts('Crossbody', this)">Crossbody</span>
            <span class="nav-link" onclick="filterProducts('Home Decor', this)">Home Decor</span>
            <span class="nav-link" onclick="filterProducts('Accessories', this)">Accessories</span>
        </div>
        <div class="btn-container">
            <a class="nav-link btn-style" onClick="showCart()"><i class="fa-solid fa-cart-shopping"></i></a>
        </div>
    </nav>
    <main>
        <div class="loading-wrapper">
            Loading<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span>
        </div>
        <div class="products-wrapper">
            <h1 class="filtered-product-header">All Products</h1>
            <div class="products">
                <!-- RENDER PRODUCTS HERE -->
            </div>
        </div>
    </main>
    <!-- CART CONTAINER -->
    <div class="cart">
        <div class="cart-header">
            <div class="column1">Item</div>
            <div class="column2">Unit Price</div>
            <div class="column3">Quantity</div>
            <div class="column4">Remove</div>
        </div>
        <div class="cart-items">
            <!-- RENDER CART ITEMS HERE -->
        </div>
        <div class="cart-footer">
            <div class="subtotal">
                Subtotal (0 items): 0 LAK
            </div>
            <a class="checkout" onclick="goToCheckout()">
                Proceed to checkout
            </a>
        </div>
    </div>
    <div class="cart-modal item-added">
        <p class="card-modal-text">Item Added</p><i class="fa-solid fa-plus"></i>
    </div>
    <div class="cart-modal item-removed">
        <p class="card-modal-text">Item Removed</p><i class="fa-solid fa-xmark"></i>
    </div>
    <div class="cart-modal empty-cart">
        <p class="card-modal-text"><i class="fa-solid fa-triangle-exclamation"></i> Your Cart Is Empty</p></i>
    </div>
    <script>
        const porductsListEl = document.querySelector(".products-list");
        // const seeMoreBtn = document.querySelector(".see-more-btn");

        // seeMoreBtn.addEventListener('click', () => {
        //     porductsListEl.scrollIntoView({ behavior: "smooth" })
        // })
    </script>
    <script src="./products.js"></script>
    <script src="./app.js"></script>
    <script src="./nav.js"></script>
</body>

</html>
