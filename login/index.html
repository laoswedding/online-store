<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Noto+Sans+Lao:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #EFF2EE;
      --paper: #FAFBF9;
      --tint: #E1E7E2;
      --ink: #16262B;
      --ink-soft: #3A4E53;
      --muted: #5B6B6F;
      --line: #D3DAD5;
      --line-strong: #A9B6B0;
      --hover: rgba(22, 38, 43, 0.06);
      --accent: #1E6B5C;
      --on-accent: #FFFFFF;
      --out: #9A3550;
      --on-out: #FFFFFF;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121C1F;
        --paper: #182428;
        --tint: #1F2D31;
        --ink: #E6EDE9;
        --ink-soft: #B9C7C4;
        --muted: #95A5A5;
        --line: #2B3B3F;
        --line-strong: #4A5E62;
        --hover: rgba(230, 237, 233, 0.08);
        --accent: #5CC4AE;
        --on-accent: #0B1A17;
        --out: #E58AA3;
        --on-out: #2A0B15;
      }
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 400 16px/1.5 'Schibsted Grotesk', 'Noto Sans Lao', 'Phetsarath OT', 'Saysettha OT', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    h1,
    h2,
    p {
      margin: 0;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Buttons and inputs */
    .btn {
      font: inherit;
      font-weight: 500;
      min-height: 40px;
      padding: 0 16px;
      border-radius: 8px;
      border: 1px solid var(--line-strong);
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }

    .btn:hover {
      background: var(--hover);
    }

    .btn.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
    }

    .btn.primary:hover {
      filter: brightness(1.08);
    }

    .btn.small {
      min-height: 36px;
      padding: 0 12px;
      font-size: 0.9rem;
    }

    .btn.danger {
      color: var(--out);
      border-color: transparent;
    }

    .btn.danger-solid {
      background: var(--out);
      border-color: var(--out);
      color: var(--on-out);
    }

    .btn.danger-solid:hover {
      filter: brightness(1.08);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: default;
    }

    input,
    select,
    textarea {
      font: inherit;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      padding: 9px 12px;
      min-height: 42px;
    }

    textarea {
      resize: vertical;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--muted);
    }

    .field {
      display: block;
    }

    .field>span {
      display: block;
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .field input,
    .field textarea {
      display: block;
      width: 100%;
    }

    .error {
      color: var(--out);
      font-size: 0.9rem;
      font-weight: 500;
    }

    .error:empty {
      display: none;
    }

    /* Login */
    .login {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-box {
      width: 100%;
      max-width: 360px;
      display: grid;
      gap: 16px;
    }

    .login-box h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
    }

    .lede {
      color: var(--muted);
    }

    .login-box .btn {
      width: 100%;
    }

    /* App shell */
    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 24px 72px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px 16px;
      padding-bottom: 6px;
    }

    .top h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .user {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      color: var(--ink-soft);
      font-size: 0.95rem;
    }

    .role {
      border: 1px solid var(--line-strong);
      border-radius: 999px;
      padding: 1px 10px;
      font-size: 0.8rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 20px 0 8px;
    }

    .toolbar input[type="search"] {
      flex: 1 1 240px;
      min-width: 0;
    }

    #add-btn {
      margin-left: auto;
    }

    .count {
      color: var(--muted);
      font-size: 0.9rem;
      min-height: 1.4em;
      margin-bottom: 16px;
    }

    /* Catalog grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 36px 24px;
    }

    .media {
      position: relative;
      aspect-ratio: 4 / 3;
      border-radius: 12px;
      overflow: hidden;
      background: var(--tint);
    }

    .media img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .media.is-out img {
      filter: grayscale(0.7);
      opacity: 0.75;
    }

    .ph {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      font-size: 3rem;
      font-weight: 600;
      color: var(--muted);
    }

    .stock {
      position: absolute;
      left: 10px;
      bottom: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--paper);
      color: var(--ink);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 3px 10px 3px 8px;
      border-radius: 999px;
    }

    .stock i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: block;
    }

    .stock.in i {
      background: var(--accent);
    }

    .stock.out i {
      border: 2px solid var(--out);
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-top: 12px;
    }

    .name {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .price {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .cat {
      color: var(--muted);
      font-size: 0.875rem;
      margin-top: 2px;
    }

    .desc {
      color: var(--ink-soft);
      font-size: 0.95rem;
      margin-top: 8px;
      overflow-wrap: anywhere;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    .link {
      margin-left: auto;
      color: var(--accent);
      font-weight: 500;
    }

    .empty {
      padding: 64px 0;
      text-align: center;
      color: var(--muted);
      display: grid;
      gap: 8px;
      justify-items: center;
    }

    .empty h2 {
      color: var(--ink);
      font-size: 1.2rem;
    }

    .empty .btn {
      margin-top: 8px;
    }

    /* Dialogs */
    dialog {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 24px;
      background: var(--paper);
      color: var(--ink);
      width: min(560px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      overflow: auto;
    }

    dialog.narrow {
      width: min(440px, calc(100vw - 32px));
    }

    dialog::backdrop {
      background: rgba(10, 20, 22, 0.55);
    }

    dialog h2 {
      font-size: 1.25rem;
      margin-bottom: 16px;
      overflow-wrap: anywhere;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .span2 {
      grid-column: 1 / -1;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
    }

    .check input {
      width: 20px;
      height: 20px;
      min-height: 0;
      padding: 0;
      accent-color: var(--accent);
    }

    .preview img {
      display: block;
      max-width: 100%;
      max-height: 120px;
      border-radius: 8px;
    }

    .preview .bad {
      color: var(--out);
      font-size: 0.875rem;
    }

    .meta {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 14px;
    }

    .meta:empty {
      display: none;
    }

    dialog .error {
      margin-top: 14px;
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: var(--ink);
      color: var(--bg);
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .toast.show {
      opacity: 1;
    }

    /* Navigation */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 4px 16px;
      border-bottom: 1px solid var(--line);
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0 22px;
    }

    .tab {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 0 10px;
      margin-bottom: -1px;
      color: var(--muted);
      font-weight: 500;
      text-decoration: none;
      border-bottom: 2px solid transparent;
    }

    .tab:hover {
      color: var(--ink);
    }

    .tab[aria-current="page"] {
      color: var(--ink);
      font-weight: 600;
      border-bottom-color: var(--accent);
    }

    .pill {
      background: var(--accent);
      color: var(--on-accent);
      border-radius: 999px;
      min-width: 20px;
      padding: 0 7px;
      text-align: center;
      font-size: 0.75rem;
      font-weight: 600;
      line-height: 1.5;
    }

    .nav .btn {
      margin: 4px 0;
    }

    /* Shared dashboard pieces */
    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .section-title a,
    .rows a,
    .detail-box a {
      color: var(--accent);
      font-weight: 500;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 24px;
      margin: 28px 0 8px;
    }

    .stats,
    .stats dd {
      margin-left: 0;
    }

    .stat dt {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .stat dd {
      margin: 2px 0 0;
    }

    .stat .big {
      display: block;
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    .stat .sub,
    .sub {
      color: var(--muted);
      font-size: 0.875rem;
    }

    .stat .sub,
    .rows .block {
      display: block;
    }

    .panels {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 36px 56px;
      margin-top: 36px;
    }

    .rows {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .rows li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 16px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }

    .rows .val {
      font-weight: 600;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .note {
      color: var(--muted);
      font-size: 0.875rem;
      margin-top: 24px;
      max-width: 70ch;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      white-space: nowrap;
    }

    .badge i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: block;
    }

    .badge.shipped i {
      background: var(--accent);
    }

    .badge.pending i {
      border: 2px solid var(--accent);
    }

    .badge.cancelled {
      color: var(--muted);
    }

    .badge.cancelled i {
      border: 2px solid var(--out);
    }

    /* Orders table */
    .table-wrap {
      overflow-x: auto;
    }

    table.orders {
      width: 100%;
      border-collapse: collapse;
    }

    .orders th {
      text-align: left;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      padding: 8px 14px 8px 0;
      border-bottom: 1px solid var(--line-strong);
      white-space: nowrap;
    }

    .orders td {
      padding: 12px 14px 12px 0;
      border-bottom: 1px solid var(--line);
      vertical-align: baseline;
    }

    .orders .id {
      font-weight: 600;
      white-space: nowrap;
    }

    .orders .num {
      text-align: right;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .orders tr.is-open>td {
      border-bottom-color: transparent;
    }

    .orders tr.detail>td {
      padding: 0 0 20px;
    }

    .detail-box {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr);
      gap: 20px 40px;
      padding: 4px 0 8px;
    }

    .detail-box h3 {
      font-size: 0.9rem;
      font-weight: 600;
      margin: 0 0 6px;
    }

    .detail-box p {
      margin: 0 0 4px;
      overflow-wrap: anywhere;
    }

    .lines {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .lines li {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lines img {
      width: 44px;
      height: 44px;
      object-fit: cover;
      border-radius: 6px;
      flex: none;
      background: var(--tint);
    }

    .stockline {
      margin-top: 10px !important;
      font-size: 0.9rem;
    }

    .stockline.short {
      color: var(--out);
      font-weight: 500;
    }

    .detail-actions {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Shipping queue */
    .group {
      margin-top: 32px;
    }

    .order-block {
      border-top: 1px solid var(--line);
      padding: 16px 0 12px;
    }

    .order-head {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 4px 16px;
      margin-bottom: 10px;
    }

    .order-head h3 {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .order-head .price {
      margin-left: auto;
    }

    /* Sales */
    .chart {
      margin: 28px 0 0;
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 160px;
      border-bottom: 1px solid var(--line-strong);
    }

    .bar {
      flex: 1 1 0;
      min-width: 2px;
      background: var(--accent);
      border-radius: 2px 2px 0 0;
    }

    .bar.zero {
      background: var(--line-strong);
    }

    .bar:hover {
      filter: brightness(1.2);
    }

    .axis {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 6px;
      color: var(--muted);
      font-size: 0.8rem;
    }

    .toprow {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px 16px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }

    .toprow .val {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .meter {
      grid-column: 1 / -1;
      height: 4px;
      border-radius: 2px;
      background: var(--tint);
    }

    .meter>span {
      display: block;
      height: 100%;
      border-radius: 2px;
      background: var(--accent);
    }

    /* Language switch */
    .lang-switch {
      display: inline-flex;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      overflow: hidden;
    }

    .lang-switch button {
      font: inherit;
      font-size: 0.85rem;
      font-weight: 500;
      min-height: 32px;
      padding: 0 12px;
      border: 0;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }

    .lang-switch button+button {
      border-left: 1px solid var(--line-strong);
    }

    .lang-switch button:hover {
      background: var(--hover);
    }

    .lang-switch button[aria-pressed="true"] {
      background: var(--ink);
      color: var(--bg);
    }

    .login {
      position: relative;
    }

    .login .lang-switch {
      position: absolute;
      top: 16px;
      right: 16px;
    }

    /* Lao script needs a little more line height and no negative tracking */
    html[lang="lo"] body {
      line-height: 1.7;
    }

    html[lang="lo"] h1,
    html[lang="lo"] h2,
    html[lang="lo"] h3,
    html[lang="lo"] .stat .big {
      letter-spacing: 0;
    }

    @media (max-width: 720px) {
      .hide-sm {
        display: none;
      }

      .detail-box {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .wrap {
        padding: 16px 16px 72px;
      }

      .fields {
        grid-template-columns: 1fr;
      }

      #add-btn {
        margin-left: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .toast {
        transition: none;
      }
    }
  </style>
</head>

<body>

  <main id="login-view" class="login">
    <div class="lang-switch" role="group" aria-label="Language / ພາສາ">
      <button type="button" data-lang="lo" lang="lo">ລາວ</button>
      <button type="button" data-lang="en" lang="en">EN</button>
    </div>
    <form id="login-form" class="login-box">
      <h1 data-i18n="app.title">Store admin</h1>
      <p class="lede" data-i18n="login.lede">Sign in with the email and password you were given.</p>
      <label class="field"><span data-i18n="login.email">Email</span>
        <input id="login-email" type="email" autocomplete="username" required>
      </label>
      <label class="field"><span data-i18n="login.password">Password</span>
        <input id="login-password" type="password" autocomplete="current-password" required>
      </label>
      <label class="check"><input id="login-show" type="checkbox"><span data-i18n="login.show">Show
          password</span></label>
      <p id="login-error" class="error" role="alert"></p>
      <button id="login-btn" class="btn primary" type="submit" data-i18n="login.submit">Sign in</button>
    </form>
  </main>

  <div id="app-view" class="wrap" hidden>
    <header class="top">
      <h1 data-i18n="app.title">Store admin</h1>
      <div class="user">
        <div class="lang-switch" role="group" aria-label="Language / ພາສາ">
          <button type="button" data-lang="lo" lang="lo">ລາວ</button>
          <button type="button" data-lang="en" lang="en">EN</button>
        </div>
        <span id="who"></span>
        <span id="role" class="role"></span>
        <button id="pw-btn" class="btn small" type="button" data-i18n="hdr.changePassword">Change password</button>
        <button id="signout-btn" class="btn small" type="button" data-i18n="hdr.signOut">Sign out</button>
      </div>
    </header>

    <nav class="nav" aria-label="Sections" data-i18n-aria="nav.aria">
      <div id="tabs" class="tabs"></div>
      <button id="refresh-btn" class="btn small" type="button" data-i18n="hdr.refresh">Refresh</button>
    </nav>

    <section id="view-overview" class="view" aria-label="Overview" hidden>
      <div id="overview-body"></div>
    </section>

    <section id="view-inventory" class="view" aria-label="Inventory" hidden>
      <div class="toolbar" role="search">
        <input id="search" type="search" placeholder="Search name, category or description"
          data-i18n-placeholder="inv.search.placeholder" aria-label="Search items" data-i18n-aria="inv.search.aria">
        <select id="filter-category" aria-label="Category" data-i18n-aria="inv.category.aria"></select>
        <select id="filter-stock" aria-label="Stock" data-i18n-aria="inv.stock.aria">
          <option value="" data-i18n="inv.stock.all">All stock</option>
          <option value="in" data-i18n="stock.in">In stock</option>
          <option value="out" data-i18n="stock.out">Out of stock</option>
        </select>
        <select id="sort" aria-label="Sort by" data-i18n-aria="inv.sort.aria">
          <option value="name" data-i18n="sort.name">Name A–Z</option>
          <option value="price-asc" data-i18n="sort.priceAsc">Price: low to high</option>
          <option value="price-desc" data-i18n="sort.priceDesc">Price: high to low</option>
          <option value="updated" data-i18n="sort.updated">Recently updated</option>
        </select>
        <button id="add-btn" class="btn primary" type="button" hidden data-i18n="inv.add">Add item</button>
      </div>
      <p id="count" class="count" aria-live="polite"></p>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty" hidden></div>
    </section>

    <section id="view-shipping" class="view" aria-label="Shipping" hidden>
      <p id="ship-count" class="count" style="margin-top:20px" aria-live="polite"></p>
      <div id="ship-body"></div>
    </section>

    <section id="view-orders" class="view" aria-label="Orders" hidden>
      <div class="toolbar" role="search">
        <input id="orders-search" type="search" placeholder="Search order number, name or phone"
          data-i18n-placeholder="ord.search.placeholder" aria-label="Search orders" data-i18n-aria="ord.search.aria">
        <select id="orders-status" aria-label="Status" data-i18n-aria="ord.status.aria">
          <option value="" data-i18n="ord.status.all">All statuses</option>
          <option value="pending" data-i18n="status.pending">Pending</option>
          <option value="shipped" data-i18n="status.shipped">Shipped</option>
          <option value="cancelled" data-i18n="status.cancelled">Cancelled</option>
        </select>
      </div>
      <p id="orders-count" class="count" aria-live="polite"></p>
      <div id="orders-body" class="table-wrap"></div>
    </section>

    <section id="view-sales" class="view" aria-label="Sales" hidden>
      <div class="toolbar">
        <select id="sales-range" aria-label="Period" data-i18n-aria="sal.period.aria">
          <option value="7" data-i18n="sal.r7">Last 7 days</option>
          <option value="30" selected data-i18n="sal.r30">Last 30 days</option>
          <option value="90" data-i18n="sal.r90">Last 90 days</option>
          <option value="all" data-i18n="sal.all">All time</option>
        </select>
      </div>
      <div id="sales-body"></div>
    </section>
  </div>

  <dialog id="item-dialog" aria-labelledby="item-dialog-title">
    <form id="item-form" novalidate>
      <h2 id="item-dialog-title">Add item</h2>
      <div class="fields">
        <label class="field span2"><span data-i18n="form.name">Name</span>
          <input id="f-name" maxlength="200" autocomplete="off" required>
        </label>
        <label class="field"><span data-i18n="form.price">Price</span>
          <input id="f-price" type="number" inputmode="decimal" min="0" step="0.01" required>
        </label>
        <label class="field"><span data-i18n="form.stock">Stock</span>
          <input id="f-stock" type="number" inputmode="numeric" min="0" step="1" required>
        </label>
        <label class="field span2"><span data-i18n="form.category">Category</span>
          <input id="f-category" list="category-list" maxlength="100" autocomplete="off">
          <datalist id="category-list"></datalist>
        </label>
        <label class="field span2"><span data-i18n="form.description">Description</span>
          <textarea id="f-description" rows="4" maxlength="5000"></textarea>
        </label>
        <label class="field span2"><span data-i18n="form.image">Image link or path</span>
          <input id="f-img" maxlength="2000" placeholder="https://… or images/photo.jpg" autocomplete="off">
        </label>
        <div id="img-preview" class="preview span2" hidden></div>
        <label class="field span2"><span data-i18n="form.learn">Learn more link or path</span>
          <input id="f-learn" maxlength="2000" placeholder="https://… or page.html" autocomplete="off">
        </label>
      </div>
      <p id="form-error" class="error" role="alert"></p>
      <p id="form-meta" class="meta"></p>
      <div class="dialog-actions">
        <button id="form-cancel" class="btn" type="button" data-i18n="btn.cancel">Cancel</button>
        <button id="form-save" class="btn primary" type="submit">Add item</button>
      </div>
    </form>
  </dialog>

  <dialog id="pw-dialog" class="narrow" aria-labelledby="pw-title">
    <form id="pw-form" novalidate>
      <h2 id="pw-title" data-i18n="pw.title">Change password</h2>
      <div class="fields">
        <label class="field span2"><span data-i18n="pw.current">Current password</span>
          <input id="pw-current" type="password" autocomplete="current-password" required>
        </label>
        <label class="field span2"><span data-i18n="pw.new">New password</span>
          <input id="pw-new" type="password" autocomplete="new-password" required>
        </label>
        <label class="field span2"><span data-i18n="pw.confirm">Confirm new password</span>
          <input id="pw-confirm" type="password" autocomplete="new-password" required>
        </label>
        <label class="check span2"><input id="pw-show" type="checkbox"><span data-i18n="pw.show">Show
            passwords</span></label>
      </div>
      <p class="meta" data-i18n="pw.hint">Use at least 10 characters. If you’re signed in on other devices, you’ll need
        to sign in again there.</p>
      <p id="pw-error" class="error" role="alert"></p>
      <div class="dialog-actions">
        <button id="pw-cancel" class="btn" type="button" data-i18n="btn.cancel">Cancel</button>
        <button id="pw-save" class="btn primary" type="submit" data-i18n="pw.title">Change password</button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-dialog" class="narrow" aria-labelledby="delete-title">
    <h2 id="delete-title">Delete item?</h2>
    <p id="delete-body"></p>
    <p id="delete-error" class="error" role="alert"></p>
    <div class="dialog-actions">
      <button id="delete-cancel" class="btn" type="button" data-i18n="del.keep">Keep item</button>
      <button id="delete-confirm" class="btn danger-solid" type="button" data-i18n="del.confirm">Delete item</button>
    </div>
  </dialog>

  <dialog id="confirm-dialog" class="narrow" aria-labelledby="confirm-title">
    <h2 id="confirm-title"></h2>
    <p id="confirm-body"></p>
    <p id="confirm-error" class="error" role="alert"></p>
    <div class="dialog-actions">
      <button id="confirm-cancel" class="btn" type="button">Go back</button>
      <button id="confirm-ok" class="btn primary" type="button">Confirm</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <!-- SUPABASE -->
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config.js"></script>
  <script src="supabase.js"></script>
  <script src="helpers.js"></script>
  <script src="login.js"></script>
  <script src="navigation.js"></script>
  <script src="orders.js"></script>
  <script src="language.js"></script>
  <script src="overview.js"></script>
  <script src="delete.js"></script>
  <script src="changePassword.js"></script>
  <script src="sales.js"></script>
  <script src="ordersTable.js"></script>
  <script src="shippingQueue.js"></script>
  <script src="shipAndCancel.js"></script>
  <script src="addEdit.js"></script>
  <script src="loadingRenderingItems.js"></script>

</body>

</html>
